# Static-site sample for bigdata-php.
# Copy site/ to /var/www/bigdata-php (or change root), then include this file
# from the http {} block, e.g. include /etc/nginx/sites-enabled/bigdata-php.conf;

server {
    listen 80;
    listen [::]:80;
    server_name package.erik.xyz;

    root /var/www/bigdata-php;
    index index.html;
    charset utf-8;
    error_page 404 /404.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

    # ngx_brotli: uncomment when the module is built into nginx.
    # brotli on;
    # brotli_comp_level 6;
    # brotli_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # add_header is not inherited by a location that declares its own headers,
    # so the security set is repeated in each location below.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # HTTPS only, terminate TLS at this server or a proxy:
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # The page inlines CSS/JS and loads only the local hero bundle plus busuanzi.
    # Enable after verifying every page on the deployment:
    # add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://busuanzi.ibruce.info; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    location = /404.html {
        internal;
    }

    # Asset filenames are not content-hashed, so purge the CDN/proxy cache
    # after deploying changed files under /assets/.
    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        access_log off;
    }

    # HTML and everything else: short cache so content updates appear quickly.
    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    }
}
