name: Integration

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  services:
    runs-on: ubuntu-latest
    services:
      trino:
        image: trinodb/trino:latest
        ports:
          - 8080:8080
      cassandra:
        image: cassandra:5.0
        ports:
          - 9042:9042
        options: >-
          --health-cmd "cqlsh -e 'SELECT release_version FROM system.local' >/dev/null 2>&1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 30
          --health-start-period 60s
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction
      - name: Wait for Trino
        run: >
          curl -fsS --retry 60 --retry-delay 5 --retry-connrefused --retry-max-time 300
          http://127.0.0.1:8080/v1/info
      - run: TRINO_HOST=127.0.0.1 CASSANDRA_HOST=127.0.0.1 composer test-integration

  hive:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      hive:
        image: apache/hive:4.0.1
        ports:
          - 10000:10000
        env:
          SERVICE_NAME: hiveserver2
          DB_DRIVER: derby
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction
      - name: Wait for HiveServer2
        run: |
          for i in $(seq 1 60); do
            if nc -z 127.0.0.1 10000 2>/dev/null; then
              echo "HiveServer2 is listening on port 10000."
              exit 0
            fi
            echo "Attempt $i/60: port 10000 is not open yet."
            sleep 5
          done
          echo "HiveServer2 did not start in time."
          exit 1
      - name: Run Hive integration test
        run: |
          for i in 1 2 3; do
            if HIVE_HOST=127.0.0.1 vendor/bin/phpunit --testsuite integration --filter HiveTest; then
              exit 0
            fi
            echo "Attempt $i/3 failed; retrying in 15s."
            sleep 15
          done
          exit 1

  demo:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction
      - name: Start demo stack
        working-directory: demo
        run: docker compose up -d
      - name: Wait for demo services to be healthy
        working-directory: demo
        run: |
          for i in $(seq 1 60); do
            total=0
            pending=""
            for container in $(docker compose ps -aq); do
              total=$((total + 1))
              status=$(docker inspect -f '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container")
              [ "$status" = "healthy" ] || pending="$pending $container:$status"
            done
            if [ "$total" -gt 0 ] && [ -z "$pending" ]; then
              echo "All $total demo services are healthy."
              exit 0
            fi
            echo "Attempt $i/60; not healthy:$pending"
            sleep 10
          done
          echo "Demo stack did not become healthy in time."
          docker compose ps -a
          docker compose logs --tail=200
          exit 1
      - name: Run demo scripts
        working-directory: demo
        run: |
          php trino.php
          php flink.php
          php airflow.php
      - name: Dump demo logs on failure
        if: failure()
        working-directory: demo
        run: |
          docker compose ps -a
          docker compose logs --tail=200
      - name: Stop demo stack
        if: always()
        working-directory: demo
        run: docker compose down -v
