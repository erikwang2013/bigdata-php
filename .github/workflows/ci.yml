name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction
      - run: composer test

  php80-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
          tools: composer:v2
      # No committed lock file, so Composer resolves require-dev too; those packages
      # need PHP 8.1+ and would block --no-dev. The flag skips only the PHP constraint.
      - run: composer config platform-check false
      - run: composer install --no-dev --prefer-dist --no-interaction --ignore-platform-req=php
      - run: find src tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - run: php tests/php80-smoke.php

  php80-full:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.0'
          coverage: none
          tools: composer:v2, phpunit:9.6
      # composer.lock is gitignored, so Composer resolves require-dev as well;
      # apache/thrift and mroosz/php-cassandra need PHP newer than 8.0. --no-dev
      # keeps them out of vendor; the flag skips only their platform constraint.
      # platform-check is disabled because the generated check also covers resolved
      # dev packages that are not installed in this lane.
      - run: composer config platform-check false
      - run: composer install --no-dev --prefer-dist --no-interaction --ignore-platform-req=php
      # --no-dev omits autoload-dev; regenerate it so the Tests\ namespace resolves.
      - run: composer dump-autoload --dev
      - run: phpunit -c phpunit-8.0.xml
