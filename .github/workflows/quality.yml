name: Quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction
      - run: vendor/bin/phpstan analyse --no-progress

  coverage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: xdebug
          tools: composer:v2
      - run: composer install --prefer-dist --no-interaction
      # No threshold: the run prints the summary and always exits 0 on test success.
      - run: vendor/bin/phpunit --testsuite unit --coverage-filter src --coverage-text
