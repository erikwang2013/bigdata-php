<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 850" width="1200" height="850" role="img" aria-labelledby="arch-title arch-desc">
  <title id="arch-title">bigdata-php architecture</title>
  <desc id="arch-desc">User application flows through optional framework adapters into the BigData manager and registry, which creates one of 19 platform drivers across 21 driver keys. Drivers talk to external systems over HTTP, Thrift, MySQL protocol, CQL, or local and WebHDFS storage.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <style>
    text { font-family: system-ui, -apple-system, 'Segoe UI', Arial, sans-serif; }
    .title { font-size: 26px; font-weight: 700; fill: #0f172a; }
    .subtitle { font-size: 14px; fill: #475569; }
    .layer { font-size: 12px; font-weight: 700; letter-spacing: 0.08em; fill: #64748b; }
    .box-title { font-size: 14px; font-weight: 600; fill: #0f172a; }
    .box-sub { font-size: 11.5px; fill: #475569; }
    .group-title { font-size: 13.5px; font-weight: 700; fill: #1e293b; }
    .entry { font-size: 12px; fill: #334155; }
    .note { font-size: 11.5px; fill: #64748b; }
    .adapter-title { font-size: 13.5px; font-weight: 600; fill: #1e3a8a; }
    .adapter-sub { font-size: 11px; fill: #3b82f6; }
    .ext-title { font-size: 13px; font-weight: 600; fill: #0f172a; }
    .ext-sub { font-size: 11px; fill: #475569; }
  </style>

  <rect width="1200" height="850" fill="#f8fafc"/>

  <text class="title" x="40" y="46">bigdata-php 架构设计</text>
  <text class="subtitle" x="40" y="70">单一包 · 可选驱动 · 19 个平台 · 21 个驱动键</text>

  <rect x="420" y="96" width="360" height="58" rx="10" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
  <text class="box-title" x="600" y="121" text-anchor="middle">用户应用</text>
  <text class="box-sub" x="600" y="141" text-anchor="middle">PHP 8.0+ · BigData::driver() · 直接 new</text>

  <line x1="600" y1="154" x2="600" y2="180" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="40" y="182" width="1120" height="96" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="layer" x="58" y="205">框架适配器（可选）</text>
  <rect x="58" y="216" width="168" height="46" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="adapter-title" x="142" y="237" text-anchor="middle">Laravel</text>
  <text class="adapter-sub" x="142" y="253" text-anchor="middle">9 / 10 / 11</text>
  <rect x="244" y="216" width="168" height="46" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="adapter-title" x="328" y="237" text-anchor="middle">ThinkPHP</text>
  <text class="adapter-sub" x="328" y="253" text-anchor="middle">6 / 8</text>
  <rect x="430" y="216" width="168" height="46" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="adapter-title" x="514" y="237" text-anchor="middle">Webman</text>
  <text class="adapter-sub" x="514" y="253" text-anchor="middle">1.x / 2.x</text>
  <rect x="616" y="216" width="168" height="46" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="adapter-title" x="700" y="237" text-anchor="middle">Hyperf</text>
  <text class="adapter-sub" x="700" y="253" text-anchor="middle">3.x</text>
  <rect x="802" y="216" width="168" height="46" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="adapter-title" x="886" y="237" text-anchor="middle">Yii2</text>
  <text class="adapter-sub" x="886" y="253" text-anchor="middle">2.x</text>
  <rect x="988" y="216" width="168" height="46" rx="7" fill="#eff6ff" stroke="#bfdbfe"/>
  <text class="adapter-title" x="1072" y="237" text-anchor="middle">Yii3</text>
  <text class="adapter-sub" x="1072" y="253" text-anchor="middle">3.x</text>

  <line x1="600" y1="278" x2="600" y2="304" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="310" y="306" width="580" height="106" rx="12" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text class="box-title" x="600" y="337" text-anchor="middle">BigData Manager / 驱动注册表</text>
  <text class="box-sub" x="600" y="360" text-anchor="middle">BigData::driver() · drivers() · available()</text>
  <text class="box-sub" x="600" y="382" text-anchor="middle">惰性工厂 · 可选依赖门禁 · 可注入 Guzzle 与 PSR-3 日志器</text>

  <line x1="600" y1="412" x2="600" y2="438" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>

  <rect x="40" y="440" width="1120" height="238" rx="10" fill="#ffffff" stroke="#e2e8f0"/>
  <text class="layer" x="58" y="464">驱动 — 19 个平台 / 21 个驱动键</text>

  <rect x="58" y="476" width="250" height="184" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="group-title" x="183" y="500" text-anchor="middle">SQL / OLAP</text>
  <text class="entry" x="183" y="526" text-anchor="middle">trino</text>
  <text class="entry" x="183" y="548" text-anchor="middle">doris *</text>
  <text class="entry" x="183" y="570" text-anchor="middle">starrocks *</text>
  <text class="entry" x="183" y="592" text-anchor="middle">kylin</text>
  <text class="entry" x="183" y="614" text-anchor="middle">druid</text>
  <text class="entry" x="183" y="636" text-anchor="middle">hive **</text>

  <rect x="323" y="476" width="195" height="184" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="group-title" x="420" y="500" text-anchor="middle">Hadoop / 计算</text>
  <text class="entry" x="420" y="526" text-anchor="middle">hadoop-webhdfs</text>
  <text class="entry" x="420" y="548" text-anchor="middle">hadoop-yarn</text>
  <text class="entry" x="420" y="570" text-anchor="middle">spark (Livy)</text>
  <text class="entry" x="420" y="592" text-anchor="middle">flink-sql</text>
  <text class="entry" x="420" y="614" text-anchor="middle">flink-jobs</text>

  <rect x="533" y="476" width="210" height="184" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="group-title" x="638" y="500" text-anchor="middle">调度器</text>
  <text class="entry" x="638" y="526" text-anchor="middle">dolphinscheduler</text>
  <text class="entry" x="638" y="548" text-anchor="middle">airflow</text>
  <text class="entry" x="638" y="570" text-anchor="middle">azkaban</text>
  <text class="entry" x="638" y="592" text-anchor="middle">oozie</text>

  <rect x="758" y="476" width="200" height="184" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="group-title" x="858" y="500" text-anchor="middle">湖仓一体</text>
  <text class="entry" x="858" y="526" text-anchor="middle">iceberg</text>
  <text class="entry" x="858" y="548" text-anchor="middle">hudi</text>
  <text class="entry" x="858" y="570" text-anchor="middle">paimon</text>
  <text class="entry" x="858" y="592" text-anchor="middle">delta-lake</text>

  <rect x="973" y="476" width="165" height="184" rx="8" fill="#f8fafc" stroke="#cbd5e1"/>
  <text class="group-title" x="1055" y="500" text-anchor="middle">NoSQL</text>
  <text class="entry" x="1055" y="526" text-anchor="middle">hbase</text>
  <text class="entry" x="1055" y="548" text-anchor="middle">cassandra ***</text>

  <text class="note" x="58" y="673">* ext-pdo_mysql · ** apache/thrift · *** mroosz/php-cassandra — 仅在该驱动被创建时检查</text>

  <line x1="600" y1="678" x2="600" y2="708" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <text class="note" x="616" y="700">HTTP · Thrift · MySQL · CQL · 本地 / WebHDFS</text>

  <rect x="40" y="710" width="1120" height="104" rx="10" fill="#f1f5f9" stroke="#cbd5e1"/>
  <text class="layer" x="58" y="734">外部系统</text>

  <rect x="58" y="744" width="205" height="56" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="ext-title" x="160" y="766" text-anchor="middle">HTTP / JSON</text>
  <text class="ext-sub" x="160" y="784" text-anchor="middle">Guzzle 7 · REST APIs</text>

  <rect x="278" y="744" width="205" height="56" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="ext-title" x="380" y="766" text-anchor="middle">Thrift TCLIService</text>
  <text class="ext-sub" x="380" y="784" text-anchor="middle">apache/thrift · HiveServer2</text>

  <rect x="498" y="744" width="205" height="56" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="ext-title" x="600" y="766" text-anchor="middle">MySQL 协议</text>
  <text class="ext-sub" x="600" y="784" text-anchor="middle">ext-pdo_mysql · Doris / StarRocks</text>

  <rect x="718" y="744" width="205" height="56" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="ext-title" x="820" y="766" text-anchor="middle">CQL</text>
  <text class="ext-sub" x="820" y="784" text-anchor="middle">mroosz/php-cassandra</text>

  <rect x="938" y="744" width="205" height="56" rx="7" fill="#ffffff" stroke="#cbd5e1"/>
  <text class="ext-title" x="1040" y="766" text-anchor="middle">本地 FS / WebHDFS</text>
  <text class="ext-sub" x="1040" y="784" text-anchor="middle">元数据文件 · HDFS REST</text>

  <text class="note" x="40" y="840">HTTP 驱动无需可选依赖；Thrift、MySQL 与 CQL 支持仅在需要时加载。</text>
</svg>
